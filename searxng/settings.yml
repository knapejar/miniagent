use_default_settings: true

server:
  secret_key: "change-me-run-python-c-import-secrets-print-secrets-token_hex-32"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

outgoing:
  # A dead engine must not hold up the whole query; the default general set
  # (brave, duckduckgo, google cse) is routinely rate limited from a home IP.
  request_timeout: 5.0
  max_request_timeout: 8.0
  pool_connections: 100

